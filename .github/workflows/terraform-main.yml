name: Terraform Plan and Apply

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  
jobs:
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    outputs: 
      artifact-id: ${{ steps.artifact-upload.outputs.artifact-id }}
    
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: eu-west-1
          role-to-assume: arn:aws:iam::709092817533:role/srv-terraform-plan
          role-session-name: TerraformAutomation

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Plan
        working-directory: terraform
        run: terraform plan -no-color

      - id: artifact-upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 #v7.0.2
        with:
          name: tfplan
          path: terraform/tfplan.txt
          archive: false

  apply:
    needs: plan
    name: Terraform Apply
    environment: prod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/download-artifact@v8
        with:
          artifact-id: ${{ needs.plan.outputs.artifact-id }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: eu-west-1
          role-to-assume: arn:aws:iam::709092817533:role/srv-terraform
          role-session-name: TerraformAutomation

      - name: Terraform Install
        run: sudo apt-get install terraform

      - name: Terraform Apply
        run: terraform apply ./tfplan.txt
