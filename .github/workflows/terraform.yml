name: Terraform plan and apply

on:
    push

#   pull_request:
#     branches:
#       - main

jobs:
  commit:
    name: Terraform Plan
    runs-on: ubuntu-latest

    steps:
      - name: Terraform Install
        run: sudo apt-get install terraform

      - name: Terraform Plan
        run: |
          terraform plan

